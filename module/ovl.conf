# Settings of the overlay engine (ovl.sh). Shell syntax.

# Directories to mount an overlay on, separated by spaces.
# Empty: detected from the ovl/ tree (recommended).
OVL_TARGETS=""

# Existing files or directories to hide (overlay whiteouts), e.g.
# OVL_HIDE="/system/app/MusicFX /system/priv-app/AudioFX"
OVL_HIDE=""

# SELinux label overrides, one "path=context" per line. By default a new
# entry takes the label of the file it replaces or of its nearest existing
# parent. Needed for example for executables of a new HAL service:
# OVL_LABELS="/vendor/bin/hw/my.service=u:object_r:hal_my_default_exec:s0"
OVL_LABELS=""

# Size of ovl.img in MiB. 0: twice the size of ovl/ plus 8.
OVL_IMG_MB=0
